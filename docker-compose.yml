services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      ENVIRONMENT: development
      DEBUG: "true"
    volumes:
      - ./data:/data:ro          # stand-in for ServiceNow / JIRA / Mailbox / Confluence
      - backend-db:/app/var      # SQLite database

volumes:
  backend-db:
