services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    env_file: ./backend/.env     # DATABASE_URL (Supabase) lives here, never in git
    environment:
      ENVIRONMENT: development
      DEBUG: "true"
    volumes:
      - ./data:/data:ro          # stand-in for ServiceNow / JIRA / Mailbox / Confluence
